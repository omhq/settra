services:
  app:
    build:
      context: .
      args:
        PRODUCT_NAME: ${PRODUCT_NAME:-Settra}
    image: ${IMAGE:-omhq/settra:0.0.1}
    ports:
      - "8000:8000"
    environment:
      - PRODUCT_NAME=${PRODUCT_NAME:-Settra}
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-self_hosted}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE=${POSTGRES_DATABASE:-settra}
      - POSTGRES_USER=${POSTGRES_USER:-settra}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-settra-dev-password}
      - APP_DB_HOST=${APP_DB_HOST:-}
      - APP_DB_PORT=${APP_DB_PORT:-}
      - APP_DB_DATABASE=${APP_DB_DATABASE:-}
      - APP_DB_USER=${APP_DB_USER:-}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:-}
      - APP_DB_SCHEMA=${APP_DB_SCHEMA:-settra_app}
      - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
      - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
      - GOOGLE_LOGIN_ENABLED=${GOOGLE_LOGIN_ENABLED:-false}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-}
      - GOOGLE_LOGIN_REDIRECT_URI=${GOOGLE_LOGIN_REDIRECT_URI:-}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_PICKER_API_KEY=${GOOGLE_PICKER_API_KEY:-}
      - GOOGLE_PICKER_APP_ID=${GOOGLE_PICKER_APP_ID:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - DATA_DIR=/data
      - CONNECTION_CONFIG_DIR=/data/connections
      - DLT_PIPELINES_DIR=/data/dlt
      - RUNTIME__DLTHUB_TELEMETRY=false
      - CONNECTORS_DIR=/config/connectors
      - CUBE_API_URL=http://cube:4000/cubejs-api
      - CUBE_API_SECRET=${CUBE_API_SECRET:-cube-dev-secret-change-me}
      - CUBE_MODEL_DIR=/cube/conf/model
      - SECRET_KEY=${SECRET_KEY:-dev-secret-change-me}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:8000}
      - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
      - APP_SESSION_TTL_SECONDS=${APP_SESSION_TTL_SECONDS:-2592000}
      - APP_SESSION_COOKIE_SECURE=${APP_SESSION_COOKIE_SECURE:-}
      - MCP_OAUTH_ENABLED=${MCP_OAUTH_ENABLED:-true}
      - MCP_OAUTH_TOKEN_TTL_SECONDS=${MCP_OAUTH_TOKEN_TTL_SECONDS:-3600}
      - MCP_OAUTH_REFRESH_TOKEN_TTL_SECONDS=${MCP_OAUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      - "MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-127.0.0.1,127.0.0.1:*,localhost,localhost:*,[::1],[::1]:*}"
      - "MCP_ALLOWED_ORIGINS=${MCP_ALLOWED_ORIGINS:-http://127.0.0.1,http://127.0.0.1:*,http://localhost,http://localhost:*,http://[::1],http://[::1]:*}"
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - STATIC_DIR=/opt/static
    volumes:
      - ./backend:/app
      - ./connectors/googledrive:/config/connectors/googledrive:ro
      - cube_conf:/cube/conf
      - ./app_data:/data
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy

  cube:
    image: ${CUBE_IMAGE:-cubejs/cube:latest}
    restart: unless-stopped
    environment:
      - CUBEJS_DB_TYPE=postgres
      - CUBEJS_DB_HOST=postgres
      - CUBEJS_DB_PORT=5432
      - CUBEJS_DB_NAME=${POSTGRES_DATABASE:-settra}
      - CUBEJS_DB_USER=${POSTGRES_USER:-settra}
      - CUBEJS_DB_PASS=${POSTGRES_PASSWORD:-settra-dev-password}
      - CUBEJS_API_SECRET=${CUBE_API_SECRET:-cube-dev-secret-change-me}
      - CUBEJS_DEV_MODE=${CUBEJS_DEV_MODE:-true}
      - CUBEJS_SCHEMA_PATH=model
      - CUBEJS_LOG_LEVEL=${CUBEJS_LOG_LEVEL:-warn}
      - CUBEJS_CACHE_AND_QUEUE_DRIVER=memory
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - cube_conf:/cube/conf
      - ./cube/cube.js:/cube/conf/cube.js:ro
    depends_on:
      app:
        condition: service_started
      postgres:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE:-settra}
      - POSTGRES_USER=${POSTGRES_USER:-settra}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-settra-dev-password}
    ports:
      - "127.0.0.1:${SETTRA_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  cube_conf:
  postgres_data:
