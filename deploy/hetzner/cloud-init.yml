#cloud-config
package_update: true
package_upgrade: false

packages:
  - ca-certificates
  - curl
  - docker.io
  - docker-compose-v2
  - openssl

bootcmd:
  - mkdir -p /opt/settra

write_files:
  - path: /opt/settra/docker-compose.yml
    owner: root:root
    permissions: "0644"
    content: |
      services:
        caddy:
          image: caddy:2
          pull_policy: always
          restart: unless-stopped
          ports:
            - "80:80"
            - "443:443"
          volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
          depends_on:
            - app

        app:
          image: ${SETTRA_IMAGE:-omhq/settra:0.0.1}
          pull_policy: always
          restart: unless-stopped
          environment:
            - PRODUCT_NAME=${PRODUCT_NAME:-__PRODUCT_NAME__}
            - POSTGRES_HOST=postgres
            - POSTGRES_PORT=5432
            - POSTGRES_DATABASE=${POSTGRES_DATABASE:-settra}
            - POSTGRES_USER=${POSTGRES_USER:-settra}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - APP_DB_HOST=${APP_DB_HOST:-}
            - APP_DB_PORT=${APP_DB_PORT:-}
            - APP_DB_DATABASE=${APP_DB_DATABASE:-}
            - APP_DB_USER=${APP_DB_USER:-}
            - APP_DB_PASSWORD=${APP_DB_PASSWORD:-}
            - APP_DB_SCHEMA=${APP_DB_SCHEMA:-settra_app}
            - GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID:-}
            - GOOGLE_OAUTH_CLIENT_SECRET=${GOOGLE_OAUTH_CLIENT_SECRET:-}
            - GOOGLE_OAUTH_REDIRECT_URI=https://${SITE_HOST}/api/google-oauth/callback
            - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
            - GOOGLE_PICKER_API_KEY=${GOOGLE_PICKER_API_KEY:-}
            - GOOGLE_PICKER_APP_ID=${GOOGLE_PICKER_APP_ID:-}
            - FRONTEND_URL=https://${SITE_HOST}
            - DATA_DIR=/data
            - CONNECTION_CONFIG_DIR=/data/connections
            - DLT_PIPELINES_DIR=/data/dlt
            - RUNTIME__DLTHUB_TELEMETRY=false
            - CUBE_API_URL=http://cube:4000/cubejs-api
            - CUBE_API_SECRET=${CUBEJS_API_SECRET}
            - CUBE_MODEL_DIR=/cube/conf/model
            - PUBLIC_URL=https://${SITE_HOST}
            - REGISTRATION_ENABLED=${REGISTRATION_ENABLED:-true}
            - APP_SESSION_TTL_SECONDS=${APP_SESSION_TTL_SECONDS:-2592000}
            - APP_SESSION_COOKIE_SECURE=true
            - MCP_OAUTH_ENABLED=${MCP_OAUTH_ENABLED:-true}
            - SETTRA_OAUTH_REDIRECT_HOSTS=${SETTRA_OAUTH_REDIRECT_HOSTS:-chatgpt.com}
            - MCP_OAUTH_TOKEN_TTL_SECONDS=${MCP_OAUTH_TOKEN_TTL_SECONDS:-3600}
            - MCP_OAUTH_REFRESH_TOKEN_TTL_SECONDS=${MCP_OAUTH_REFRESH_TOKEN_TTL_SECONDS:-2592000}
            - MCP_ALLOWED_HOSTS=${SITE_HOST},${SITE_HOST}:443
            - MCP_ALLOWED_ORIGINS=https://${SITE_HOST},https://chatgpt.com,https://chat.openai.com,https://platform.openai.com
            - CORS_ALLOWED_ORIGINS=https://${SITE_HOST}
            - SECRET_KEY=${SECRET_KEY}
            - LOG_LEVEL=${LOG_LEVEL:-INFO}
            - STATIC_DIR=/opt/static
          volumes:
            - settra_data:/data
            - cube_conf:/cube/conf
          depends_on:
            postgres:
              condition: service_healthy

        cube:
          image: ${CUBE_IMAGE:-cubejs/cube:latest}
          pull_policy: always
          restart: unless-stopped
          environment:
            - CUBEJS_DB_TYPE=postgres
            - CUBEJS_DB_HOST=postgres
            - CUBEJS_DB_PORT=5432
            - CUBEJS_DB_NAME=${POSTGRES_DATABASE:-settra}
            - CUBEJS_DB_USER=${POSTGRES_USER:-settra}
            - CUBEJS_DB_PASS=${POSTGRES_PASSWORD}
            - CUBEJS_API_SECRET=${CUBEJS_API_SECRET}
            - CUBEJS_DEV_MODE=${CUBEJS_DEV_MODE:-true}
            - CUBEJS_SCHEMA_PATH=model
            - CUBEJS_LOG_LEVEL=${CUBEJS_LOG_LEVEL:-warn}
            - CUBEJS_CACHE_AND_QUEUE_DRIVER=memory
          volumes:
            - cube_conf:/cube/conf
          depends_on:
            app:
              condition: service_started
            postgres:
              condition: service_healthy

        postgres:
          image: ${POSTGRES_IMAGE:-postgres:17-alpine}
          pull_policy: always
          restart: unless-stopped
          environment:
            - POSTGRES_DB=${POSTGRES_DATABASE:-settra}
            - POSTGRES_USER=${POSTGRES_USER:-settra}
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          volumes:
            - postgres_data:/var/lib/postgresql/data
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 12

      volumes:
        caddy_data:
        caddy_config:
        settra_data:
        cube_conf:
        postgres_data:

runcmd:
  - systemctl enable --now docker
  - |
    set -eu
    cd /opt/settra

    product_name="__PRODUCT_NAME__"

    if [ ! -f .env ]; then
      public_ipv4="$(curl -fsS http://169.254.169.254/hetzner/v1/metadata/public-ipv4 || curl -fsS https://api.ipify.org)"
      public_ipv4_dashes="$(printf '%s' "$public_ipv4" | tr '.' '-')"
      site_host="settra-${public_ipv4_dashes}.sslip.io"

      {
        printf 'PRODUCT_NAME=%s\n' "$product_name"
        printf 'SECRET_KEY=%s\n' "$(openssl rand -hex 32)"
        printf 'POSTGRES_DATABASE=settra\n'
        printf 'POSTGRES_USER=settra\n'
        printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 24)"
        printf 'APP_DB_SCHEMA=settra_app\n'
        printf 'CUBEJS_API_SECRET=%s\n' "$(openssl rand -hex 32)"
        printf 'SITE_HOST=%s\n' "$site_host"
        printf 'PUBLIC_URL=https://%s\n' "$site_host"
        printf 'REGISTRATION_ENABLED=true\n'
        printf 'APP_SESSION_TTL_SECONDS=2592000\n'
        printf 'APP_SESSION_COOKIE_SECURE=true\n'
        printf 'MCP_OAUTH_ENABLED=true\n'
        printf 'SETTRA_OAUTH_REDIRECT_HOSTS=chatgpt.com\n'
        printf 'MCP_OAUTH_TOKEN_TTL_SECONDS=3600\n'
        printf 'MCP_OAUTH_REFRESH_TOKEN_TTL_SECONDS=2592000\n'
        printf 'CUBEJS_DEV_MODE=true\n'
        printf 'LOG_LEVEL=INFO\n'
        printf 'SETTRA_IMAGE=omhq/settra:0.0.1\n'
        printf 'POSTGRES_IMAGE=postgres:17-alpine\n'
        printf 'CUBE_IMAGE=cubejs/cube:latest\n'
        printf 'GOOGLE_OAUTH_CLIENT_ID=\n'
        printf 'GOOGLE_OAUTH_CLIENT_SECRET=\n'
        printf 'GOOGLE_CLOUD_PROJECT=\n'
        printf 'GOOGLE_PICKER_API_KEY=\n'
        printf 'GOOGLE_PICKER_APP_ID=\n'
      } > .env
      chmod 0600 .env

      {
        printf '%s URL: https://%s\n' "$product_name" "$site_host"
        printf 'AI connection URL: https://%s/mcp\n' "$site_host"
        printf 'Create the first application account at: https://%s/register\n' "$site_host"
        printf 'Google OAuth redirect URI: https://%s/api/google-oauth/callback\n' "$site_host"
        printf 'Set Google OAuth and Picker credentials in /opt/settra/.env, then run docker compose up -d --force-recreate app.\n'
      } > credentials.txt
      chmod 0600 credentials.txt
    fi

    set -a
    . ./.env
    set +a

    export PRODUCT_NAME="${PRODUCT_NAME:-$product_name}"
    export PUBLIC_URL="${PUBLIC_URL:-https://${SITE_HOST}}"
    export MCP_OAUTH_ENABLED="${MCP_OAUTH_ENABLED:-true}"
    export SETTRA_OAUTH_REDIRECT_HOSTS="${SETTRA_OAUTH_REDIRECT_HOSTS:-chatgpt.com}"

    cat > Caddyfile <<EOF
    ${SITE_HOST} {
      reverse_proxy app:8000
    }
    EOF

    docker compose pull
    docker compose up -d
    docker compose ps
