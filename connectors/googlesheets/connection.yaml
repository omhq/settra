name: Google Sheets
plugin: googlesheets
logo: googlesheets.svg
description: Sync spreadsheet tabs into durable PostgreSQL tables for Cube and automated agents
docs: https://developers.google.com/workspace/sheets/api/guides/authorizing
fields:
  - key: spreadsheet_id
    label: Spreadsheet ID
    type: text
    placeholder: 11iXfj-RHpFsil7_hNK-oQjCqmBLlDfCvju2AOF-ieb4
    help: "Selected through Google Picker when the source is created."
    required: true
  - key: sheets
    label: Sheets
    type: text
    placeholder: "* or Dashboard, Students, Books"
    default: "*"
    help: "Comma-separated tab names or wildcard patterns. Use * to synchronize every tab."
    required: false
